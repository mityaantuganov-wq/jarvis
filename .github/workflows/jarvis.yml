name: Jarvis AI improvement proposal

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  models: read

concurrency:
  group: jarvis-auto-improve
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ask AI to improve
        run: python improve.py
        env:
          MODEL_TOKEN: ${{ secrets.MODEL_TOKEN }}

      - name: Validate HTML and JavaScript
        run: python validate.py

      - name: Install browser test dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test core app behavior
        run: npm run test:e2e

      - name: Test Worker validation, history, and timeout handling
        run: npm run test:worker

      - name: Propose changes for review
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            index.html
          branch: automation/jarvis-ai-improvement
          delete-branch: true
          commit-message: "auto: propose JARVIS improvement"
          title: "chore: automated JARVIS improvement proposal"
          body: |
            This pull request contains a proposed AI-generated change to `index.html`.

            Before this PR was created, the workflow ran:
            - HTML and JavaScript validation (`python validate.py`)
            - Playwright browser tests (`npm run test:e2e`)
            - Worker validation and timeout tests (`npm run test:worker`)

            Review the diff before merging. This workflow does not deploy or write the generated change directly to `main`.
