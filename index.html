<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>JARVIS — личный ассистент</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2c;--cyan:#61ddff;--text:#e9f7ff;--muted:#8ba7bb;--line:#1c3850}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#102b45 0,#07111f 55%);color:var(--text);font:16px system-ui,-apple-system,sans-serif;min-height:100dvh;display:flex;flex-direction:column}
header{text-align:center;padding:22px 16px 14px}.orb{width:84px;height:84px;margin:0 auto 10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e5ffff 0,#61ddff 8%,#1579b5 36%,#09243d 68%,#07111f 72%);box-shadow:0 0 24px #25bfff77,inset 0 0 20px #7deaff66;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 38px #25bfffaa,inset 0 0 24px #7deaff99}}
h1{font-size:20px;letter-spacing:.22em;margin:0;color:var(--cyan)}#status{font-size:12px;color:var(--muted);margin-top:5px}
main{width:100%;max-width:760px;margin:0 auto;flex:1;display:flex;flex-direction:column;padding:0 12px 12px;min-height:0}
#log{flex:1;min-height:180px;overflow-y:auto;padding:12px;border:1px solid var(--line);border-radius:18px;background:#07111fb8}
.msg{padding:10px 12px;margin:8px 0;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}.me{background:#16334a;color:#fff;margin-left:12%;text-align:right}.jarvis{background:#0d263a;color:var(--cyan);margin-right:8%}.system{color:var(--muted);font-size:12px;text-align:center}
#bar{display:flex;gap:8px;padding-top:10px}input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:14px;font-size:16px}button{border:1px solid #2a607d;background:#12344a;color:var(--cyan);border-radius:12px;padding:12px 15px;font-size:17px;cursor:pointer}button:active{transform:scale(.97)}button:disabled{opacity:.5}
.tools{display:flex;gap:8px;flex-wrap:wrap;padding-top:8px}.tools button{font-size:13px;padding:8px 10px;color:var(--muted);border-color:var(--line);background:#0b1b2b}
footer{text-align:center;color:#68879e;font-size:11px;padding:8px 10px 14px}
@media(min-height:700px){main{padding-bottom:16px}}@media(prefers-reduced-motion:reduce){.orb{animation:none}}
</style>
</head>
<body>
<header><div class="orb" aria-hidden="true"></div><h1>J.A.R.V.I.S.</h1><div id="status">Личный ассистент · готов к работе</div></header>
<main>
<div id="log" role="log" aria-live="polite"></div>
<div id="bar"><input id="inp" autocomplete="off" placeholder="Введите команду…" aria-label="Команда"><button id="mic" title="Голосовой ввод" aria-label="Голосовой ввод">🎙</button><button id="send" title="Отправить" aria-label="Отправить">➤</button></div>
<div class="tools"><button id="voiceMode" aria-pressed="false">Голосовой диалог: выкл.</button><button id="clear">Очистить чат</button><button id="notes">Заметки</button><button id="backup">Резервная копия</button><button id="restore">Восстановить копию</button><input id="restoreFile" type="file" accept="application/json,.json" hidden><button id="aiSettings">Настройки ИИ</button><button id="help">Команды</button></div>
</main><footer>История и заметки хранятся только в этом браузере на вашем устройстве.</footer>
<script>
(()=> {
'use strict';
const $=id=>document.getElementById(id), log=$('log'), inp=$('inp'), status=$('status');
const HISTORY='jarvis.history.v1', NOTES='jarvis.notes.v1';
let timerId=null, voiceMode=false, recognition=null, recognitionBusy=false;
function read(key,fallback){try{const v=JSON.parse(localStorage.getItem(key)||'null');return v??fallback}catch{return fallback}}
function saveHistory(){try{localStorage.setItem(HISTORY,JSON.stringify([...log.querySelectorAll('.msg:not(.system)')].map(x=>({text:x.textContent,kind:x.classList.contains('me')?'me':'jarvis'})).slice(-150)))}catch{}}
function add(text,kind='jarvis',persist=true){const d=document.createElement('div');d.className='msg '+kind;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;if(persist&&kind!=='system')saveHistory()}
function speak(text){add('Джарвис: '+text,'jarvis');if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';u.onstart=()=>{if(recognition&&recognitionBusy){try{recognition.stop()}catch{}}};u.onend=()=>{if(voiceMode)setTimeout(startListening,350)};speechSynthesis.speak(u)}else if(voiceMode){setTimeout(startListening,350)}}
function restore(){const items=read(HISTORY,[]);if(items.length){items.forEach(x=>add(x.text,x.kind,false))}else add('Джарвис запущен. Скажите «команды», чтобы узнать, что я умею.','jarvis',false)}
function showHelp(){speak('Доступные команды: привет; который час или сколько времени; какая сегодня дата; заметка текст; покажи заметки; таймер 5 минут; стоп таймер; стоп или выключи голосовой диалог; очистить чат. Для подключения языковой модели откройте настройки ИИ и укажите адрес своего безопасного сервера.')}
const AI_ENDPOINT_KEY='jarvis.ai.endpoint.v1';
function aiEndpoint(){try{return localStorage.getItem(AI_ENDPOINT_KEY)||''}catch{return ''}}
function configureAI(){const current=aiEndpoint();const value=prompt('Адрес безопасного AI-сервера, например https://ваш-сервер.example/api/chat. API-ключ вводить сюда не нужно.',current);if(value===null)return;const endpoint=value.trim();if(endpoint&&(!/^https:\/\//i.test(endpoint)||endpoint.length>500)){add('Нужен полный HTTPS-адрес сервера.','system',false);return}try{if(endpoint)localStorage.setItem(AI_ENDPOINT_KEY,endpoint);else localStorage.removeItem(AI_ENDPOINT_KEY);add(endpoint?'Адрес AI-сервера сохранён на этом устройстве.':'Подключение к AI-серверу отключено.','system',false)}catch{add('Не удалось сохранить настройку в браузере.','system',false)}}
async function askAI(promptText){const endpoint=aiEndpoint();if(!endpoint){speak('Я пока работаю в локальном режиме. Чтобы подключить языковую модель, откройте настройки ИИ и укажите адрес безопасного сервера.');return}status.textContent='Связываюсь с языковой моделью…';try{const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),25000);let response;try{response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:promptText,history:read(HISTORY,[]).slice(-12)}),signal:controller.signal})}finally{clearTimeout(timeout)}if(!response.ok)throw new Error('http');const data=await response.json();const answer=typeof data.reply==='string'?data.reply.trim():'';if(!answer)throw new Error('empty');status.textContent='Личный ассистент · готов к работе';speak(answer.slice(0,8000))}catch{status.textContent='Ошибка соединения с ИИ';speak('Не удалось получить ответ от языковой модели. Проверьте адрес сервера, подключение к интернету и настройки сервера.')}}
function handle(raw){const original=String(raw||'').trim();if(!original)return;add('Вы: '+original,'me');const c=original.toLocaleLowerCase('ru-RU');
if(/^(привет|здравствуй|здравствуйте|доброе утро|добрый день|добрый вечер)/.test(c)){speak('Здравствуйте, сэр. Я готов к работе.')}
else if(/врем|который час|сколько час|сколько сейчас|текущее время|назови время/.test(c)){speak('Сейчас '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}))}
else if(c.includes('дата')||c.includes('какой сегодня день')){speak('Сегодня '+new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'}))}
else if(c==='команды'||c==='помощь'||c==='что ты умеешь'){showHelp()}
else if(c.startsWith('заметка ')){const note=original.slice(original.indexOf(' ')+1).trim();if(!note)speak('Напишите текст заметки после слова заметка.');else{const a=read(NOTES,[]);a.push({text:note,date:new Date().toISOString()});try{localStorage.setItem(NOTES,JSON.stringify(a.slice(-200)));speak('Заметка сохранена.')}catch{speak('Не удалось сохранить заметку. Проверьте свободное место в браузере.')}}}
else if(c==='заметки'||c==='покажи заметки'){const a=read(NOTES,[]);if(!a.length)speak('Сохранённых заметок пока нет.');else speak('Ваши заметки: '+a.map((n,i)=>(i+1)+'. '+n.text).join('. '))}
else if(c.startsWith('таймер ')){const m=c.match(/таймер\s+(\d+)\s*(секунд(?:ы|у)?|сек|минут(?:ы|у)?|мин|час(?:а|ов)?)?/);if(!m){speak('Пример команды: таймер 5 минут.');return}const n=Number(m[1]),unit=m[2]||'минут';if(!Number.isFinite(n)||n<1||n>1440){speak('Укажите время от 1 до 1440 единиц.');return}const ms=/сек/.test(unit)?n*1000:/час/.test(unit)?n*3600000:n*60000;if(timerId)clearTimeout(timerId);speak('Таймер установлен.');status.textContent='Таймер запущен';timerId=setTimeout(()=>{timerId=null;status.textContent='Личный ассистент · готов к работе';speak('Время вышло. Таймер завершён.');try{const ctx=new (window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;g.gain.value=.12;o.start();setTimeout(()=>{o.stop();ctx.close()},900)}catch{}},ms)}
else if(c.includes('стоп таймер')||c.includes('отмени таймер')){if(timerId){clearTimeout(timerId);timerId=null;status.textContent='Личный ассистент · готов к работе';speak('Таймер остановлен.')}else speak('Активного таймера нет.')}
else if(/^(стоп|остановись|замолчи|выключи голосовой диалог)$/.test(c)){if(voiceMode){voiceMode=false;updateVoiceButton();try{recognition?.stop()}catch{}recognitionBusy=false;if('speechSynthesis'in window)speechSynthesis.cancel();status.textContent='Голосовой диалог выключен';add('Голосовой диалог остановлен.','system',false)}else{if('speechSynthesis'in window)speechSynthesis.cancel();speak('Остановил голосовой ответ.')}}
else if(c==='очистить чат'){log.replaceChildren();saveHistory();speak('История чата очищена.')}
else{askAI(original)}}
$('send').addEventListener('click',()=>{const v=inp.value;inp.value='';handle(v);inp.focus()});inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('send').click()}});
$('clear').addEventListener('click',()=>{if(confirm('Очистить историю чата?')){log.replaceChildren();saveHistory();speak('История чата очищена.')}});
$('notes').addEventListener('click',()=>handle('заметки'));
$('backup').addEventListener('click',()=>{
  try{
    const data={app:'JARVIS',version:1,exportedAt:new Date().toISOString(),history:read(HISTORY,[]),notes:read(NOTES,[])};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='jarvis-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
    add('Резервная копия истории и заметок подготовлена.','system',false);
  }catch{add('Не удалось создать резервную копию. Проверьте настройки браузера.','system',false)}
});
$('restore').addEventListener('click',()=>{
  if(!confirm('Восстановление заменит текущие историю и заметки. Сначала сохраните текущую резервную копию. Продолжить?'))return;
  $('restoreFile').value='';
  $('restoreFile').click();
});
$('restoreFile').addEventListener('change',async e=>{
  const file=e.target.files&&e.target.files[0];
  if(!file)return;
  try{
    if(file.size>2*1024*1024)throw new Error('size');
    const data=JSON.parse(await file.text());
    if(!data||data.app!=='JARVIS'||data.version!==1||!Array.isArray(data.history)||!Array.isArray(data.notes))throw new Error('format');
    if(data.history.length>150||data.notes.length>200)throw new Error('count');
    const history=data.history.map(item=>{
      if(!item||typeof item.text!=='string'||item.text.length>5000||!['me','jarvis'].includes(item.kind))throw new Error('history');
      return {text:item.text,kind:item.kind};
    });
    const notes=data.notes.map(note=>{
      if(!note||typeof note.text!=='string'||!note.text.trim()||note.text.length>5000)throw new Error('notes');
      return {text:note.text,date:typeof note.date==='string'?note.date:''};
    });
    const oldHistory=localStorage.getItem(HISTORY),oldNotes=localStorage.getItem(NOTES);
    try{
      localStorage.setItem(HISTORY,JSON.stringify(history));
      localStorage.setItem(NOTES,JSON.stringify(notes));
    }catch(err){
      if(oldHistory===null)localStorage.removeItem(HISTORY);else localStorage.setItem(HISTORY,oldHistory);
      if(oldNotes===null)localStorage.removeItem(NOTES);else localStorage.setItem(NOTES,oldNotes);
      throw err;
    }
    log.replaceChildren();
    restore();
    add('Резервная копия восстановлена.','system',false);
  }catch(err){
    const message=err&&err.message==='size'?'Файл больше 2 МБ.':err&&['format','count','history','notes'].includes(err.message)?'Файл не похож на корректную резервную копию JARVIS версии 1.':'Не удалось сохранить данные. Проверьте свободное место браузера.';
    add('Не удалось восстановить копию. '+message,'system',false);
  }finally{e.target.value=''}
});
$('help').addEventListener('click',showHelp);
$('aiSettings').addEventListener('click',configureAI);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function startListening(){if(!voiceMode||!SR||recognitionBusy)return;try{if(!recognition){recognition=new SR();recognition.lang='ru-RU';recognition.interimResults=false;recognition.maxAlternatives=1;recognition.continuous=false;recognition.onresult=e=>{const t=e.results?.[e.results.length-1]?.[0]?.transcript;if(t)handle(t)};recognition.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){voiceMode=false;updateVoiceButton();status.textContent='Нет доступа к микрофону';add('Разрешите доступ к микрофону в настройках браузера.','system',false)}};recognition.onend=()=>{recognitionBusy=false;if(voiceMode&&!('speechSynthesis'in window&&speechSynthesis.speaking))setTimeout(startListening,500)}}recognitionBusy=true;status.textContent='Голосовой диалог · слушаю…';recognition.start()}catch{recognitionBusy=false;if(voiceMode)setTimeout(startListening,900)}}
function updateVoiceButton(){$('voiceMode').textContent='Голосовой диалог: '+(voiceMode?'вкл.':'выкл.');$('voiceMode').setAttribute('aria-pressed',String(voiceMode));if(!voiceMode)status.textContent='Личный ассистент · готов к работе'}
$('voiceMode').addEventListener('click',()=>{if(!SR){speak('Голосовой диалог не поддерживается этим браузером. Попробуйте Chrome.');return}voiceMode=!voiceMode;updateVoiceButton();if(voiceMode){speak('Голосовой диалог включён. Я слушаю вас.')}else{try{recognition?.stop()}catch{}recognitionBusy=false;if('speechSynthesis'in window)speechSynthesis.cancel();status.textContent='Голосовой диалог выключен'}});
$('mic').addEventListener('click',()=>{if(!SR){speak('Голосовой ввод не поддерживается этим браузером. Попробуйте Chrome.');return}try{const r=new SR();r.lang='ru-RU';r.interimResults=false;r.maxAlternatives=1;status.textContent='Слушаю…';r.onresult=e=>{const t=e.results?.[0]?.[0]?.transcript;if(t)handle(t)};r.onerror=()=>{status.textContent='Голосовой ввод недоступен';add('Не удалось распознать речь. Проверьте разрешение микрофона.','system',false)};r.onend=()=>{if(!voiceMode)status.textContent='Личный ассистент · готов к работе'};r.start()}catch{status.textContent='Личный ассистент · готов к работе';speak('Не удалось запустить микрофон.')}});restore();
})();
</script>
</body>
</html>
